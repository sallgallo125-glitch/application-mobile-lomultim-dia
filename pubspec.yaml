name: mobile_app
description: "LO Multimédia — Flutter port (in progress, mirrors ../mobile-app)"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  http: ^1.2.2
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  url_launcher: ^6.2.6
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0
  image_picker: ^1.2.4
  barcode_widget: ^2.0.4
  sqflite: ^2.4.4+1
  path: ^1.9.1
  sqflite_common: ^2.5.13+1
  lottie: ^3.6.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/Panier 3D blanc avec logo LM.png
    - assets/animations/
    - assets/brands/
    - assets/lo-plus/
    - assets/products/
    - assets/banners/
    - assets/categories/
    - assets/paiement/
